version: "3.8"

services:
  affilliasports:
    container_name: affilliasports
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.affilliasports.rule=Host(`affilliasports.com`)"
      - "traefik.http.routers.affilliasports.entrypoints=websecure"
      - "traefik.http.routers.affilliasports.tls.certresolver=myresolver"
      - "traefik.http.services.affilliasports.loadbalancer.server.port=3000"
    networks:
      - web

networks:
  web:
    external: true