cat > docker-compose.yml <<'YAML'
services:
  affilliasports:
    container_name: affilliasports
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.affilliasports.rule=Host(`affilliasports.com`,`www.affilliasports.com`)"
      - "traefik.http.routers.affilliasports.entrypoints=websecure"
      - "traefik.http.routers.affilliasports.tls.certresolver=myresolver"
      - "traefik.http.services.affilliasports.loadbalancer.server.port=3000"
    networks:
      - web
networks:
  web:
    external: true
YAML
